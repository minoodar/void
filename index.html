  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 50% 42%, #050714 0%, #02030a 58%, #010208 100%);
    }
    #void-gl-note {
      position: fixed;
      top: max(100px, calc(env(safe-area-inset-top, 0px) + 92px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: min(560px, calc(100vw - 32px));
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(251, 191, 36, .30);
      background: rgba(6, 8, 13, .78);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
      color: rgba(235, 240, 245, .86);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      animation: vmGlNoteIn .7s cubic-bezier(.22, 1, .36, 1) .15s both;
    }
    @keyframes vmGlNoteIn {
      from { opacity: 0; transform: translate(-50%, -6px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #void-gl-note { animation: none; }
    }
    /* The extension-widget toggle has no counterpart in the web build. */
    #void-music-root .vm-widget-btn { display: none !important; }
    #void-reopen {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 2000;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid rgba(235, 240, 245, .28);
      background: rgba(8, 10, 14, .72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
      color: rgba(250, 252, 255, .94);
      font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .02em;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease;
    }
    #void-reopen:hover { border-color: rgba(251, 191, 36, .55); background: rgba(12, 15, 22, .86); }
    #void-reopen:focus-visible { outline: 2px solid rgba(220, 230, 240, .9); outline-offset: 4px; }
    #void-reopen[hidden] { display: none; }

    /* Site rail: the three marks and the quill form one vertical column at the
       middle-right, quill last. 4 × 44px + 3 × 10px = 206px, so the column is
       centred by starting 103px above the middle; the quill starts 162px below
       that (see #void-god-quill in void-letters.css). On shorter windows the
       centre would meet the demo star, so the column slides down just below it
       instead of moving out of the middle altogether. */
    #void-topnav.void-topnav--rail {
      position: fixed;
      top: max(calc(50% - 103px), calc(30vh + 52px));
      right: max(18px, env(safe-area-inset-right, 0px));
      left: auto;
      z-index: 1100;
      width: auto; height: auto;
      transform: none;
      pointer-events: none;
      /* Music Mode's stray sweep hides direct body children that still paint;
         an unpainted wrapper is skipped, and the list restores visibility. */
      visibility: hidden;
    }
    .void-topnav__rail {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      margin: 0; padding: 0;
      list-style: none;
      pointer-events: none;
      visibility: visible;
    }
    .void-topnav__rail > li { display: flex; pointer-events: none; }
    .void-topnav__link--action { background: none; border: 0; font-family: inherit; cursor: pointer; }
    .void-topnav__link--action[aria-busy="true"] { color: rgba(251, 191, 36, .92); }
    /* The shapes are the only visible label; aria-label + title carry the name.
       Every mark is 44px like the quill and the circular player buttons. */
    .void-topnav__link.void-topnav__icon {
      display: grid; place-items: center;
      box-sizing: border-box;
      width: 44px; height: 44px;
      margin: 0; padding: 0;
      border: 1px solid rgba(235, 240, 245, .20);
      border-radius: 50%;
      background: rgba(8, 10, 14, .42);
      -webkit-backdrop-filter: blur(10px);
              backdrop-filter: blur(10px);
      color: rgba(235, 240, 245, .74);
      opacity: .78;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none; appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .2s ease, border-color .2s ease, color .2s ease, background .2s ease;
    }
    .void-topnav__link.void-topnav__icon svg {
      display: block;
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }
    .void-topnav__link.void-topnav__icon:hover {
      opacity: 1; color: rgba(250, 252, 255, .96); border-color: rgba(235, 240, 245, .4);
    }
    .void-topnav__link.void-topnav__icon:active { background: rgba(235, 240, 245, .10); }
    .void-topnav__link.void-topnav__icon:focus-visible {
      outline: 2px solid rgba(220, 230, 240, .9); outline-offset: 4px; opacity: 1;
    }
    /* On phones the demo star sits at 22%, not 30%. */
    @media (max-width: 520px) {
      #void-topnav.void-topnav--rail {
        top: max(calc(50% - 103px), calc(22vh + 52px));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .void-topnav__link.void-topnav__icon { transition: none; }
    }
    /* When neither the centred nor the star-clearing position can keep the whole
       206px column off the meta/dock (narrow windows) or above the bottom edge
       (very short ones), the four controls move together to the compact top-left
       strip: still one column, still quill last (see void-letters.css). */
    @media (max-width: 520px) and (max-height: 653px),
           (min-width: 521px) and (max-width: 683px) and (max-height: 688px),
           (min-width: 684px) and (max-width: 703px) and (max-height: 605px),
           (min-width: 704px) and (max-height: 379px) {
      #void-topnav.void-topnav--rail {
        top: calc(4px + env(safe-area-inset-top, 0px));
        left: 64px;
        right: auto;
        transform: none;
      }
      .void-topnav__rail { gap: 4px; }
      .void-topnav__link.void-topnav__icon { width: 30px; height: 30px; }
      .void-topnav__link.void-topnav__icon svg { width: 16px; height: 16px; }
    }
    /* Under 400px there is no room for 30px marks above the meta row either:
       the same column continues at 22px and still clears the status pill. */
    @media (max-width: 703px) and (max-height: 399px), (min-width: 704px) and (max-height: 379px) {
      .void-topnav__rail { gap: 2px; }
      .void-topnav__link.void-topnav__icon { width: 22px; height: 22px; }
      .void-topnav__link.void-topnav__icon svg { width: 12px; height: 12px; }
    }

    /* Minimal streaming status: one pill under the top edge, clear of the top-left
       counter; never a panel. */
    #void-golden-status {
      position: fixed; top: calc(104px + env(safe-area-inset-top, 0px)); left: 50%;
      z-index: 1090; transform: translate(-50%, -3px);
      display: flex; align-items: center; gap: 8px;
      max-width: min(340px, calc(100vw - 24px));
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(235, 240, 245, .18);
      background: rgba(8, 10, 14, .95);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .42);
      color: rgba(235, 240, 245, .92);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .01em;
      pointer-events: none; opacity: 0; visibility: hidden;
      transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
    }
    #void-golden-status.is-on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s ease, transform .2s ease; }
    #void-golden-status.is-action { pointer-events: auto; }
    #void-golden-status.is-error { border-color: rgba(240, 130, 130, .42); }
    #void-golden-status[hidden] { display: none; }
    .void-golden-status__dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: rgba(251, 191, 36, .9); box-shadow: 0 0 8px rgba(251, 191, 36, .35); }
    #void-golden-status.is-loading .void-golden-status__dot,
    #void-golden-status.is-buffering .void-golden-status__dot { animation: vgPulse 1.4s ease-in-out infinite; }
    #void-golden-status.is-playing .void-golden-status__dot { background: rgba(190, 225, 195, .95); box-shadow: 0 0 8px rgba(190, 225, 195, .3); animation: none; }
    #void-golden-status.is-error .void-golden-status__dot { background: rgba(240, 150, 140, .95); box-shadow: 0 0 8px rgba(240, 130, 130, .35); animation: none; }
    #void-golden-status.is-blocked { border-color: rgba(251, 191, 36, .34); }
    #void-golden-status.is-blocked .void-golden-status__dot { animation: none; }
    .void-golden-status__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .void-golden-status__action {
      flex: none; padding: 3px 10px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(251, 191, 36, .45);
      background: rgba(251, 191, 36, .12);
      color: rgba(251, 216, 140, .96); font: inherit;
    }
    .void-golden-status__action:hover { background: rgba(251, 191, 36, .22); }
    .void-golden-status__action:focus-visible { outline: 1px solid rgba(235, 240, 245, .8); outline-offset: 2px; }
    .void-golden-status__action[hidden] { display: none; }
    @keyframes vgPulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
    @media (max-width: 380px) {
      #void-golden-status { top: calc(124px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 20px); }
    }
    /* In the compact top-left tier the column ends at 136px, so the centered
       pill would cross it on narrow screens; it drops below the column while
       there is room (height >= 400px). Under 400px the 22px column ends at
       98px and the pill keeps its usual line. */
    @media (max-width: 520px) and (max-height: 653px),
           (min-width: 521px) and (max-width: 683px) and (max-height: 688px),
           (min-width: 684px) and (max-width: 703px) and (max-height: 605px),
           (min-width: 704px) and (max-height: 379px) {
      #void-golden-status { top: calc(142px + env(safe-area-inset-top, 0px)); }
    }
    @media (max-width: 703px) and (max-height: 399px), (min-width: 704px) and (max-height: 379px) {
      #void-golden-status { top: calc(104px + env(safe-area-inset-top, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #void-golden-status { transition: opacity .12s ease, visibility 0s linear .12s; }
      .void-golden-status__dot { animation: none !important; }
    }

    /* Golden Folder selector: one glass window over the existing player.
       Only transform/opacity animate; the sheen is two clipped light layers. */
    #void-golden-modal {
      width: min(440px, calc(100vw - 24px));
      max-height: min(82vh, 640px);
      max-height: min(82dvh, 640px);
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 20px;
      /* Deep-space glass: the galaxy stays faintly visible through the window,
         while the surface itself is dense enough that no label ever sits on
         moving starfield. */
      background: linear-gradient(180deg, rgba(9, 12, 18, .965) 0%, rgba(5, 7, 12, .975) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(118%);
      backdrop-filter: blur(16px) saturate(118%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px rgba(235, 240, 245, .10);
      color: rgba(250, 252, 255, .96);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
      overflow: hidden;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #void-golden-modal[open] { display: block; animation: vgmIn .22s cubic-bezier(.22, 1, .36, 1); }
    #void-golden-modal::backdrop {
      background: rgba(2, 3, 8, .62);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      #void-golden-modal { background: rgba(5, 7, 12, .97); }
      #void-golden-modal::backdrop { background: rgba(2, 3, 8, .82); }
    }
    @keyframes vgmIn {
      from { opacity: 0; transform: translateY(6px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    .void-golden-modal__sheen {
      position: absolute;
      inset: -45% -25%;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(105deg, transparent 36%, rgba(255, 255, 255, .07) 46%, rgba(251, 191, 36, .04) 51%, transparent 63%),
        radial-gradient(58% 44% at 24% 16%, rgba(251, 191, 36, .06), transparent 72%);
      opacity: .32;
      transform: translate3d(-16%, 6%, 0);
      animation: vgmSheen 12s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }
    .void-golden-modal__sheen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(42% 34% at 74% 84%, rgba(190, 210, 255, .05), transparent 72%);
      opacity: .42;
      animation: vgmBreathe 7.5s ease-in-out infinite alternate;
    }
    @keyframes vgmSheen {
      0%   { transform: translate3d(-18%, 8%, 0); opacity: .20; }
      50%  { opacity: .36; }
      100% { transform: translate3d(18%, -8%, 0); opacity: .24; }
    }
    @keyframes vgmBreathe {
      from { opacity: .12; transform: translate3d(0, 2%, 0) scale(.96); }
      to   { opacity: .34; transform: translate3d(-2%, -2%, 0) scale(1.04); }
    }
    .void-golden-modal__panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: inherit;
      padding: 22px 22px max(18px, calc(env(safe-area-inset-bottom, 0px) + 14px));
    }
    .void-golden-modal__head { display: flex; align-items: baseline; justify-content: flex-start; gap: 9px; }
    .void-golden-modal__title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .015em;
      color: rgba(250, 252, 255, .96);
    }
    .void-golden-modal__title::before {
      content: "";
      display: inline-block;
      width: 2px;
      height: 12px;
      margin-right: 9px;
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(251, 191, 36, .82), rgba(251, 191, 36, .22));
      vertical-align: -1px;
    }
    .void-golden-modal__total {
      flex: none;
      align-self: center;
      padding: 1px 8px;
      border: 1px solid rgba(251, 191, 36, .20);
      border-radius: 999px;
      background: rgba(251, 191, 36, .06);
      color: rgba(255, 228, 168, .9);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .075em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .void-golden-modal__count {
      flex: none;
      font-size: 11.5px;
      letter-spacing: .03em;
      color: rgba(235, 240, 245, .74);
      transition: color .18s ease;
    }
    .void-golden-modal__count.is-active { color: rgba(255, 228, 168, .80); }
    .void-golden-modal__tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .void-golden-modal__all {
      padding: 2px 0;
      border: 0;
      background: none;
      color: rgba(251, 191, 36, .86);
      font: inherit;
      font-size: 12px;
      letter-spacing: .01em;
      cursor: pointer;
    }
    .void-golden-modal__all:hover { color: rgba(255, 214, 120, .98); }
    .void-golden-modal__all:focus-visible { outline: 1px solid rgba(235, 240, 245, .7); outline-offset: 3px; border-radius: 4px; }
    .void-golden-modal__all:disabled { opacity: .4; cursor: default; }
    .void-golden-modal__list {
      flex: 1 1 auto;
      min-height: 0;
      /* Fixed to the height of four rows: extra tracks scroll inside instead of growing the dialog. */
      height: 174.25px;
      max-height: min(46vh, 360px);
      margin: 0;
      padding: 2px 4px 2px 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(235, 240, 245, .30) rgba(235, 240, 245, .05);
    }
    .void-golden-modal__list::-webkit-scrollbar { width: 6px; }
    .void-golden-modal__list::-webkit-scrollbar-button { display: none; }
    .void-golden-modal__list::-webkit-scrollbar-track { border-radius: 999px; background: rgba(235, 240, 245, .05); }
    .void-golden-modal__list::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(235, 240, 245, .28); }
    .void-golden-modal__list::-webkit-scrollbar-thumb:hover { background: rgba(235, 240, 245, .44); }
    .void-golden-modal__row { display: flex; position: relative; }
    .void-golden-modal__pick {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 8px;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .18s ease;
    }
    .void-golden-modal__pick:hover { background: rgba(235, 240, 245, .045); }
    .void-golden-modal__pick:focus-within { background: rgba(235, 240, 245, .035); }
    .void-golden-modal__icon {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: rgba(235, 240, 245, .56);
      transition: color .18s ease;
    }
    .void-golden-modal__icon svg { display: block; }
    .void-golden-modal__pick:hover .void-golden-modal__icon { color: rgba(235, 240, 245, .84); }
    .void-golden-modal__row.is-playing .void-golden-modal__pick { box-shadow: inset 2px 0 0 rgba(251, 191, 36, .60); }
    .void-golden-modal__row.is-playing .void-golden-modal__icon { color: rgba(251, 191, 36, .92); }
    .void-golden-modal__eq { display: none; }
    .void-golden-modal__row.is-playing .void-golden-modal__note { display: none; }
    .void-golden-modal__row.is-playing .void-golden-modal__eq { display: block; }
    .void-golden-modal__eq rect {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: vgEq 1.05s ease-in-out infinite;
    }
    .void-golden-modal__eq rect:nth-child(2) { animation-duration: .82s; animation-delay: -.2s; }
    .void-golden-modal__eq rect:nth-child(3) { animation-duration: 1.25s; animation-delay: -.45s; }
    @keyframes vgEq {
      0%, 100% { transform: scaleY(.45); }
      50%      { transform: scaleY(1); }
    }
    .void-golden-modal__now {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .void-golden-modal__pick input {
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
      display: grid;
      place-content: center;
      width: 17px;
      height: 17px;
      margin: 0;
      flex: none;
      border: 1px solid rgba(235, 240, 245, .34);
      border-radius: 5px;
      background: rgba(255, 255, 255, .04);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .void-golden-modal__pick input::after {
      content: "";
      width: 9px;
      height: 5px;
      border-left: 2px solid #0b0d12;
      border-bottom: 2px solid #0b0d12;
      transform: rotate(-45deg) scale(0);
      transition: transform .14s ease;
    }
    .void-golden-modal__pick input:checked { background: rgba(251, 191, 36, .92); border-color: rgba(251, 191, 36, .92); }
    .void-golden-modal__pick input:checked::after { transform: rotate(-45deg) scale(1); }
    .void-golden-modal__pick input:focus-visible { outline: 2px solid rgba(235, 240, 245, .75); outline-offset: 3px; }
    .void-golden-modal__label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      color: rgba(250, 252, 255, .96);
    }
    .void-golden-modal__empty { padding: 18px 8px; color: rgba(235, 240, 245, .74); }
    .void-golden-modal__retry {
      margin-top: 10px;
      padding: 2px 0;
      border: 0;
      background: none;
      color: rgba(251, 191, 36, .86);
      font: inherit;
      font-size: 12px;
      letter-spacing: .01em;
      cursor: pointer;
    }
    .void-golden-modal__retry:hover { color: rgba(255, 214, 120, .98); }
    .void-golden-modal__retry:focus-visible { outline: 1px solid rgba(235, 240, 245, .7); outline-offset: 3px; border-radius: 4px; }
    /* One quiet line inside the selector only: why online tracks can fail to connect. */
    .void-golden-modal__net {
      margin: 0;
      padding: 0 2px;
      font-size: 12.5px;
      line-height: 1.5;
      color: rgba(235, 240, 245, .82);
    }
    .void-golden-modal__info {
      width: 14px;
      height: 14px;
      margin-right: 7px;
      vertical-align: -2px;
      opacity: .55;
    }
    .void-golden-modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding-top: 2px; }
    .void-golden-modal__btn {
      min-height: 40px;
      padding: 10px 17px;
      border: 1px solid rgba(235, 240, 245, .24);
      border-radius: 999px;
      background: rgba(255, 255, 255, .055);
      color: rgba(250, 252, 255, .94);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, opacity .18s ease;
    }
    .void-golden-modal__btn:hover { background: rgba(255, 255, 255, .07); }
    .void-golden-modal__btn:focus-visible { outline: 2px solid rgba(235, 240, 245, .8); outline-offset: 3px; }
    .void-golden-modal__btn--primary {
      border-color: rgba(251, 191, 36, .55);
      background: rgba(251, 191, 36, .16);
      color: rgba(255, 230, 170, .98);
    }
    .void-golden-modal__btn--primary:hover { background: rgba(251, 191, 36, .26); }
    .void-golden-modal__btn:disabled { opacity: .38; cursor: default; }
    .void-golden-modal__btn:disabled:hover { background: rgba(255, 255, 255, .03); }
    .void-golden-modal__btn--primary:disabled:hover { background: rgba(251, 191, 36, .16); }

    /* ---- Sharing: one quiet row target, one folder action, one small sheet ---- */
    .void-golden-modal__share {
      flex: none;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      margin: 0 2px 0 4px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: rgba(235, 240, 245, .44);
      cursor: pointer;
      transition: color .18s ease, background .18s ease;
    }
    .void-golden-modal__share svg {
      display: block;
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .void-golden-modal__share:hover { color: rgba(250, 252, 255, .9); background: rgba(235, 240, 245, .06); }
    .void-golden-modal__share:focus-visible { outline: 1px solid rgba(235, 240, 245, .8); outline-offset: 2px; color: rgba(250, 252, 255, .9); }
    .void-golden-modal__btn--share {
      margin-right: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding-left: 13px;
      padding-right: 14px;
      color: rgba(235, 240, 245, .78);
    }
    .void-golden-modal__btn--share svg {
      display: block;
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Narrowest phones: the share control keeps its mark, not its label, so the
       footer stays one row and the dialog keeps its baseline height. */
    @media (max-width: 344px) {
      .void-golden-modal__btn--share { width: 38px; padding: 0; gap: 0; justify-content: center; font-size: 0; }
    }

    /* The sharing sheet is its own small top-layer window: same glass, tighter. */
    #void-golden-share {
      width: min(330px, calc(100vw - 32px));
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(11, 14, 20, .96) 0%, rgba(4, 6, 10, .97) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px rgba(235, 240, 245, .10);
      color: rgba(250, 252, 255, .97);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
      overflow: hidden;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #void-golden-share[open] { display: block; animation: vgShareIn .2s cubic-bezier(.22, 1, .36, 1); }
    #void-golden-share::backdrop {
      background: rgba(2, 3, 8, .55);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      #void-golden-share { background: rgba(5, 7, 12, .94); }
      #void-golden-share::backdrop { background: rgba(2, 3, 8, .78); }
    }
    @keyframes vgShareIn {
      from { opacity: 0; transform: translateY(4px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    .void-golden-share__panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 20px 20px 16px;
    }
    .void-golden-share__eyebrow {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: rgba(251, 191, 36, .72);
    }
    .void-golden-share__title {
      margin: 0;
      padding-right: 26px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .01em;
      color: rgba(250, 252, 255, .96);
    }
    .void-golden-share__meta {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: rgba(235, 240, 245, .74);
    }
    .void-golden-share__msg {
      margin: 2px 0 5px;
      font-size: 12.5px;
      line-height: 1.5;
      color: rgba(235, 240, 245, .84);
    }
    .void-golden-share__actions { display: flex; flex-direction: column; gap: 7px; }
    .void-golden-share__btn {
      padding: 9px 14px;
      border: 1px solid rgba(235, 240, 245, .2);
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      color: rgba(250, 252, 255, .9);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, opacity .18s ease;
    }
    .void-golden-share__btn:hover { background: rgba(255, 255, 255, .08); }
    .void-golden-share__btn--primary {
      border-color: rgba(251, 191, 36, .5);
      background: rgba(251, 191, 36, .14);
      color: rgba(255, 230, 170, .98);
    }
    .void-golden-share__btn--primary:hover { background: rgba(251, 191, 36, .24); }
    .void-golden-share__btn:focus-visible { outline: 2px solid rgba(235, 240, 245, .8); outline-offset: 3px; }
    .void-golden-share__btn[hidden] { display: none; }
    .void-golden-share__status {
      min-height: 16px;
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(190, 225, 195, .9);
    }
    .void-golden-share__status.is-raw { color: rgba(255, 228, 168, .84); word-break: break-all; user-select: text; -webkit-user-select: text; }
    .void-golden-share__close {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: rgba(235, 240, 245, .72);
      font: 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      cursor: pointer;
    }
    .void-golden-share__close:hover { color: rgba(250, 252, 255, .95); background: rgba(235, 240, 245, .07); }
    .void-golden-share__close:focus-visible { outline: 2px solid rgba(235, 240, 245, .8); outline-offset: 2px; }

    /* Recipient invitation: a floating card above the dock, never a modal, never an ad. */
    #void-invite {
      position: fixed;
      left: max(16px, env(safe-area-inset-left, 0px));
      bottom: calc(168px + env(safe-area-inset-bottom, 0px));
      z-index: 1080;
      width: min(336px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 15px 17px 14px;
      border: 1px solid rgba(235, 240, 245, .16);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(11, 14, 20, .95) 0%, rgba(6, 8, 13, .96) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(118%);
      backdrop-filter: blur(16px) saturate(118%);
      box-shadow: 0 16px 44px rgba(0, 0, 0, .46), inset 0 1px 0 rgba(255, 255, 255, .1);
      color: rgba(250, 252, 255, .96);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
      animation: vgInviteIn .46s cubic-bezier(.22, 1, .36, 1) both;
    }
    #void-invite[hidden] { display: none; }
    @keyframes vgInviteIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .void-invite__eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(251, 191, 36, .84);
    }
    .void-invite__title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: .005em;
      color: rgba(250, 252, 255, .97);
    }
    .void-invite__line {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: rgba(235, 240, 245, .8);
    }
    .void-invite__track {
      margin: 3px 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: rgba(255, 228, 168, .9);
    }
    .void-invite__track[hidden] { display: none; }
    .void-invite__actions { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .void-invite__go {
      flex: 1 1 auto;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid rgba(251, 191, 36, .5);
      border-radius: 999px;
      background: rgba(251, 191, 36, .14);
      color: rgba(255, 230, 170, .98);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .07em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, opacity .18s ease;
    }
    .void-invite__go:hover { background: rgba(251, 191, 36, .24); }
    .void-invite__go:focus-visible { outline: 2px solid rgba(235, 240, 245, .8); outline-offset: 3px; }
    .void-invite__go[hidden] { display: none; }
    .void-invite__close {
      flex: none;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: rgba(235, 240, 245, .72);
      font: 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      cursor: pointer;
    }
    .void-invite__close:hover { color: rgba(250, 252, 255, .95); background: rgba(235, 240, 245, .07); }
    .void-invite__close:focus-visible { outline: 2px solid rgba(235, 240, 245, .8); outline-offset: 2px; }
    @media (max-width: 520px) {
      #void-invite {
        left: 12px;
        right: 12px;
        bottom: calc(160px + env(safe-area-inset-bottom, 0px));
        width: auto;
      }
    }
    @media (max-height: 430px) {
      #void-invite { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px 11px; gap: 4px; }
      .void-invite__title { font-size: 14px; }
    }
    @media (max-width: 420px) {
      #void-golden-modal { width: calc(100vw - 20px); border-radius: 18px; }
      .void-golden-modal__panel { padding: 18px 16px max(14px, calc(env(safe-area-inset-bottom, 0px) + 12px)); }
      .void-golden-modal__pick { padding: 13px 6px; }
      .void-golden-modal__list { height: 182.25px; max-height: min(50vh, 380px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #void-golden-modal[open] { animation: none; }
      #void-golden-share[open] { animation: none; }
      #void-invite { animation: none; }
      .void-golden-modal__sheen,
      .void-golden-modal__sheen::after { animation: none; opacity: .22; transform: none; }
      .void-golden-modal__pick,
      .void-golden-modal__pick input,
      .void-golden-modal__pick input::after,
      .void-golden-modal__icon,
      .void-golden-modal__count,
      .void-golden-modal__btn,
      .void-golden-modal__share,
      .void-golden-share__btn,
      .void-invite__go { transition: none; }
      .void-golden-modal__eq rect { animation: none; }
    }

  </style>
</head>
<body>
  <noscript>Void needs JavaScript to play audio and render the visualizer.</noscript>

  <nav id="void-topnav" class="void-topnav void-topnav--rail" aria-label="Site navigation">
    <ul class="void-topnav__rail" aria-label="Golden Folder and project links">
      <li><button id="void-golden-folder" class="void-topnav__link void-topnav__link--action void-topnav__icon" type="button" aria-busy="false" aria-haspopup="dialog" aria-expanded="false" aria-label="Golden Folder" title="Golden Folder"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.4"/></svg></button></li>
      <li><a id="void-topnav-support" class="void-topnav__link void-topnav__icon" href="https://donito.me/u-b8wjr" target="_blank" rel="noopener noreferrer" aria-label="Support" title="Support"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.7 19.7 18.5H4.3Z"/></svg></a></li>
      <li><a id="void-topnav-creator" class="void-topnav__link void-topnav__icon" href="https://github.com/minoodar" target="_blank" rel="noopener noreferrer" aria-label="Meet the Creator" title="Meet the Creator"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4.9" y="4.9" width="14.2" height="14.2" rx="1.4"/></svg></a></li>
    </ul>
  </nav>

  <div id="void-golden-status" role="status" aria-live="polite" aria-hidden="true">
    <span class="void-golden-status__dot" aria-hidden="true"></span>
    <span class="void-golden-status__text"></span>
    <button class="void-golden-status__action" type="button" hidden></button>
  </div>

  <dialog id="void-golden-modal" aria-labelledby="void-golden-modal-title">
    <div class="void-golden-modal__sheen" aria-hidden="true"></div>
    <div class="void-golden-modal__panel">
      <div class="void-golden-modal__head">
        <h2 id="void-golden-modal-title" class="void-golden-modal__title">Golden Folder</h2>
        <span id="void-golden-total" class="void-golden-modal__total">Loading…</span>
      </div>
      <div class="void-golden-modal__tools">
        <button id="void-golden-select-all" class="void-golden-modal__all" type="button">Select all</button>
        <span id="void-golden-count" class="void-golden-modal__count" aria-live="polite">0 selected</span>
      </div>
      <ul id="void-golden-list" class="void-golden-modal__list" aria-label="Golden Folder tracks"></ul>
      <div class="void-golden-modal__foot">
        <button id="void-golden-share-folder" class="void-golden-modal__btn void-golden-modal__btn--share" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="12.1" cy="3.6" r="1.7"/><circle cx="3.9" cy="8" r="1.7"/><circle cx="12.1" cy="12.4" r="1.7"/><path d="M5.4 7.25 10.6 4.35M5.4 8.75l5.2 2.9"/></svg>
          Share
        </button>
        <button id="void-golden-cancel" class="void-golden-modal__btn" type="button">Cancel</button>
        <button id="void-golden-play" class="void-golden-modal__btn void-golden-modal__btn--primary" type="button" disabled>Play selected</button>
      </div>
    </div>
  </dialog>

  <dialog id="void-golden-share" aria-labelledby="void-golden-share-title">
    <div class="void-golden-modal__sheen" aria-hidden="true"></div>
    <div class="void-golden-share__panel">
      <span class="void-golden-share__eyebrow">Golden Folder</span>
      <h2 id="void-golden-share-title" class="void-golden-share__title">Golden Folder</h2>
      <p id="void-golden-share-meta" class="void-golden-share__meta"></p>
      <p id="void-golden-share-msg" class="void-golden-share__msg"></p>
      <div class="void-golden-share__actions">
        <button id="void-golden-share-copy" class="void-golden-share__btn void-golden-share__btn--primary" type="button">Copy invitation link</button>
        <button id="void-golden-share-native" class="void-golden-share__btn" type="button" hidden>Share&hellip;</button>
      </div>
      <p id="void-golden-share-status" class="void-golden-share__status" role="status" aria-live="polite"></p>
      <button id="void-golden-share-close" class="void-golden-share__close" type="button" aria-label="Close share window">&times;</button>
    </div>
  </dialog>

  <aside id="void-invite" hidden aria-labelledby="void-invite-title" aria-describedby="void-invite-line">
    <span class="void-invite__eyebrow">Golden Folder</span>
    <h2 id="void-invite-title" class="void-invite__title"></h2>
    <p id="void-invite-line" class="void-invite__line"></p>
    <p id="void-invite-track" class="void-invite__track"></p>
    <div class="void-invite__actions">
      <button id="void-invite-go" class="void-invite__go" type="button"></button>
      <button id="void-invite-close" class="void-invite__close" type="button" aria-label="Dismiss invitation">&times;</button>
    </div>
  </aside>

  <button id="void-reopen" type="button" hidden>Open music</button>

  <script src="void-music.js?v=20261111"></script>
  <script src="void-music-viz.js"></script>
  <script src="void-boot.js?v=20261111"></script>
  <script src="void-folder.js?v=20261111"></script>
  <script src="void-invite.js"></script>
  <script src="void-letters-api.js?v=20261109" defer></script>
  <script src="void-letters.js?v=20261112" defer></script>
  <script src="void-artwork.js" defer></script>
  <script src="void-admin.js?v=20261114" defer></script>
  <script src="void-domains.js?v=20261114" defer></script>
</body>
</html>
