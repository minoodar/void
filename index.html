<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Void Galaxy Music</title>
 <link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="void-music.css">
  <link rel="stylesheet" href="void-counter.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 50% 42%, #050714 0%, #02030a 58%, #010208 100%);
    }
    #void-gl-note {
      position: fixed;
      top: max(100px, calc(env(safe-area-inset-top, 0px) + 92px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: min(560px, calc(100vw - 32px));
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(251, 191, 36, .30);
      background: rgba(6, 8, 13, .78);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
      color: rgba(235, 240, 245, .86);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      animation: vmGlNoteIn .7s cubic-bezier(.22, 1, .36, 1) .15s both;
    }
    @keyframes vmGlNoteIn {
      from { opacity: 0; transform: translate(-50%, -6px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #void-gl-note { animation: none; }
    }
    /* The extension-widget toggle has no counterpart in the web build. */
    #void-music-root .vm-widget-btn { display: none !important; }
    #void-reopen {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 2000;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid rgba(235, 240, 245, .28);
      background: rgba(8, 10, 14, .72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
      color: rgba(250, 252, 255, .94);
      font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .02em;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease;
    }
    #void-reopen:hover { border-color: rgba(251, 191, 36, .55); background: rgba(12, 15, 22, .86); }
    #void-reopen:focus-visible { outline: 2px solid rgba(220, 230, 240, .9); outline-offset: 4px; }
    #void-reopen[hidden] { display: none; }

    /* Golden Folder: two quiet link groups around a single gold hairline. */
    .void-topnav__groups { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; }
    /* Four grouped links need more room than the original three-item canopy (442px of
       labels + the canopy's 22px side padding, so the labels keep their edge gap). */
    @media (min-width: 521px) { #void-topnav { width: min(486px, calc(100vw - 24px)); } }
    .void-topnav__split { width: 1px; height: 14px; flex: none; background: linear-gradient(180deg, transparent, rgba(251, 191, 36, .34), transparent); }
    .void-topnav__link--action { background: none; border: 0; font-family: inherit; cursor: pointer; }
    .void-topnav__link--action[aria-busy="true"] { color: rgba(251, 191, 36, .92); }

    /* Minimal streaming status: one pill under the navigation canopy, never a panel.
       104px clears the open canopy (≈83px tall) so the menu never covers it. */
    #void-golden-status {
      position: fixed; top: calc(104px + env(safe-area-inset-top, 0px)); left: 50%;
      z-index: 1090; transform: translate(-50%, -3px);
      display: flex; align-items: center; gap: 8px;
      max-width: min(340px, calc(100vw - 24px));
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(235, 240, 245, .18);
      background: rgba(8, 10, 14, .78);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .42);
      color: rgba(235, 240, 245, .86);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .01em;
      pointer-events: none; opacity: 0; visibility: hidden;
      transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
    }
    #void-golden-status.is-on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s ease, transform .2s ease; }
    #void-golden-status.is-action { pointer-events: auto; }
    #void-golden-status.is-error { border-color: rgba(240, 130, 130, .42); }
    #void-golden-status[hidden] { display: none; }
    .void-golden-status__dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: rgba(251, 191, 36, .9); box-shadow: 0 0 8px rgba(251, 191, 36, .35); }
    #void-golden-status.is-loading .void-golden-status__dot,
    #void-golden-status.is-buffering .void-golden-status__dot { animation: vgPulse 1.4s ease-in-out infinite; }
    #void-golden-status.is-playing .void-golden-status__dot { background: rgba(190, 225, 195, .95); box-shadow: 0 0 8px rgba(190, 225, 195, .3); animation: none; }
    #void-golden-status.is-error .void-golden-status__dot { background: rgba(240, 150, 140, .95); box-shadow: 0 0 8px rgba(240, 130, 130, .35); animation: none; }
    #void-golden-status.is-blocked { border-color: rgba(251, 191, 36, .34); }
    #void-golden-status.is-blocked .void-golden-status__dot { animation: none; }
    .void-golden-status__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .void-golden-status__action {
      flex: none; padding: 3px 10px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(251, 191, 36, .45);
      background: rgba(251, 191, 36, .12);
      color: rgba(251, 216, 140, .96); font: inherit;
    }
    .void-golden-status__action:hover { background: rgba(251, 191, 36, .22); }
    .void-golden-status__action:focus-visible { outline: 1px solid rgba(235, 240, 245, .8); outline-offset: 2px; }
    .void-golden-status__action[hidden] { display: none; }
    @keyframes vgPulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
    @media (max-width: 520px) {
      .void-topnav__groups { gap: 11px; }
      .void-topnav__list { gap: 9px; }
      .void-topnav__list > li + li::before { display: none; }
    }
    @media (max-width: 380px) {
      .void-topnav__groups { flex-wrap: wrap; gap: 3px 10px; }
      .void-topnav__split { display: none; }
      .void-topnav__list { gap: 7px; }
      #void-golden-status { top: calc(124px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 20px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #void-golden-status { transition: opacity .12s ease, visibility 0s linear .12s; }
      .void-golden-status__dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <noscript>Void Galaxy Music needs JavaScript to play audio and render the visualizer.</noscript>

  <nav id="void-topnav" class="void-topnav" aria-label="Site navigation">
    <button id="void-topnav-handle" class="void-topnav__handle" type="button"
            aria-expanded="false" aria-controls="void-topnav-canopy" aria-label="Open navigation">
      <span class="void-topnav__grip" aria-hidden="true"></span>
    </button>
    <div id="void-topnav-canopy" class="void-topnav__canopy" aria-hidden="true">
      <div class="void-topnav__groups">
        <ul class="void-topnav__list" aria-label="Golden Folder and support">
          <li><button id="void-golden-folder" class="void-topnav__link void-topnav__link--action" type="button" aria-busy="false">Golden Folder</button></li>
          <li><a class="void-topnav__link" href="https://donito.me/u-b8wjr" target="_blank" rel="noopener noreferrer">💖 Support</a></li>
        </ul>
        <span class="void-topnav__split" aria-hidden="true"></span>
        <ul class="void-topnav__list" aria-label="Project links">
          <li><a class="void-topnav__link" href="https://github.com/minoodar/Void-Galaxy" target="_blank" rel="noopener noreferrer">Get Extension</a></li>
          <li><a class="void-topnav__link" href="https://github.com/minoodar" target="_blank" rel="noopener noreferrer">Meet the Creator</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="void-golden-status" role="status" aria-live="polite" aria-hidden="true">
    <span class="void-golden-status__dot" aria-hidden="true"></span>
    <span class="void-golden-status__text"></span>
    <button class="void-golden-status__action" type="button" hidden></button>
  </div>

  <button id="void-reopen" type="button" hidden>Open music</button>

  <script src="void-music.js"></script>
  <script src="void-music-viz.js"></script>
  <script>
    (function () {
      'use strict';

      function showNote(message, parent) {
        var host = parent || document.body;
        var note = document.createElement('div');
        note.id = 'void-gl-note';
        note.setAttribute('role', 'status');
        note.textContent = message;
        host.appendChild(note);
        return note;
      }

      function webgl2Available() {
        try {
          return !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2'));
        } catch (e) {
          return false;
        }
      }

      function boot() {
        if (!window.VoidMusic || typeof window.VoidMusic.enter !== 'function') {
          showNote('The player could not load. Check that void-music.js and void-music.css sit next to this page.');
          return;
        }

        window.VoidMusic.enter();

        var root = document.getElementById('void-music-root');
        var reopen = document.getElementById('void-reopen');
        function syncReopen() { reopen.hidden = !(root && root.hidden); }
        reopen.addEventListener('click', function () { window.VoidMusic.enter(); });
        if (root && window.MutationObserver) {
          new MutationObserver(syncReopen).observe(root, { attributes: true, attributeFilter: ['hidden'] });
        }
        syncReopen();

        if (!webgl2Available()) {
          showNote(
            'Galaxy view is unavailable because this browser does not support WebGL2. ' +
            'Playback, queue, seek and volume still work normally.',
            document.getElementById('void-music-root') || document.body
          );
        }
      }

      // Wait for the first real layout: arc geometry reads window.innerWidth.
      if (document.readyState === 'complete') requestAnimationFrame(boot);
      else window.addEventListener('load', function () { requestAnimationFrame(boot); }, { once: true });
    })();
  </script>
  <script>
    (function () {
      'use strict';

      var nav = document.getElementById('void-topnav');
      var handle = document.getElementById('void-topnav-handle');
      var canopy = document.getElementById('void-topnav-canopy');
      if (!nav || !handle || !canopy) return;

      var HIDE_MS = 1800;
      var INITIAL_SHOW_MS = 2000;
      var open = false;
      var hovering = false;
      var hideTimer = 0;
      var lastPointerType = '';
      var pointerFocus = false;
      var suppressFocusOpen = false;

      function focusVisible(el) {
        try { return el.matches(':focus-visible'); } catch (e) { return true; }
      }
      function focusHoldsMenu() {
        var active = document.activeElement;
        if (!active) return false;
        if (canopy.contains(active)) return true;
        return active === handle && focusVisible(handle);
      }
      function clearHide() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = 0; }
      }
      function scheduleHide(delay) {
        clearHide();
        hideTimer = setTimeout(function () {
          hideTimer = 0;
          if (!open || hovering) return;
          if (nav.matches(':hover') || focusHoldsMenu()) return;
          setOpen(false);
        }, typeof delay === 'number' ? delay : HIDE_MS);
      }
      function setOpen(next, delay) {
        open = !!next;
        nav.classList.toggle('is-open', open);
        handle.setAttribute('aria-expanded', open ? 'true' : 'false');
        handle.setAttribute('aria-label', open ? 'Hide navigation' : 'Open navigation');
        if (open) {
          canopy.removeAttribute('aria-hidden');
        } else {
          canopy.setAttribute('aria-hidden', 'true');
        }
        clearHide();
        if (open) scheduleHide(delay);
      }
      function pointerCanHover(e) {
        return e.pointerType !== 'touch';
      }

      document.addEventListener('pointermove', function (e) {
        if (!pointerCanHover(e) || open || e.clientY > 12) return;
        var rect = nav.getBoundingClientRect();
        if (rect.width && Math.abs(e.clientX - (rect.left + rect.width / 2)) > rect.width / 2 + 90) return;
        setOpen(true);
      }, { passive: true });

      handle.addEventListener('pointerenter', function (e) {
        if (e.pointerType === 'touch') return;
        hovering = true;
        clearHide();
        if (!open) setOpen(true);
      });
      handle.addEventListener('pointerleave', function (e) {
        if (e.pointerType === 'touch') return;
        hovering = false;
        if (open) scheduleHide();
      });
      handle.addEventListener('pointerdown', function (e) {
        lastPointerType = e.pointerType || '';
        pointerFocus = true;
        setTimeout(function () { pointerFocus = false; }, 0);
      }, { passive: true });

      canopy.addEventListener('pointerenter', function (e) {
        if (e.pointerType === 'touch') return;
        hovering = true;
        clearHide();
      });
      canopy.addEventListener('pointerleave', function (e) {
        if (e.pointerType === 'touch') return;
        hovering = false;
        if (open) scheduleHide();
      });

      handle.addEventListener('focus', function () {
        if (!pointerFocus && !suppressFocusOpen && focusVisible(handle)) setOpen(true);
      });
      nav.addEventListener('focusin', function () { clearHide(); });
      nav.addEventListener('focusout', function (e) {
        if (e.relatedTarget && nav.contains(e.relatedTarget)) return;
        if (open) scheduleHide();
      });

      handle.addEventListener('click', function (e) {
        var fromPointer = e.detail !== 0;
        if (fromPointer && lastPointerType !== 'touch' && lastPointerType !== 'pen') {
          if (!open) setOpen(true);
          return;
        }
        setOpen(!open);
        if (fromPointer && !open) handle.focus({ preventScroll: true });
      });

      canopy.addEventListener('click', function (e) {
        var link = e.target && e.target.closest ? e.target.closest('.void-topnav__link') : null;
        if (link) setOpen(false);
      });

      document.addEventListener('pointerdown', function (e) {
        if (open && !nav.contains(e.target)) setOpen(false);
      }, true);

      // Capture on window so a scoped Escape never reaches the player's document-level exit shortcut.
      window.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' || !open || !nav.contains(document.activeElement)) return;
        e.preventDefault();
        e.stopPropagation();
        suppressFocusOpen = true;
        setOpen(false);
        handle.focus({ preventScroll: true });
        setTimeout(function () { suppressFocusOpen = false; }, 0);
      }, true);

      function start() {
        var hoverable = true;
        try { hoverable = window.matchMedia('(hover: hover)').matches; } catch (e) {}
        if (hoverable) setOpen(true, INITIAL_SHOW_MS);
      }
      if (document.readyState === 'complete') requestAnimationFrame(start);
      else window.addEventListener('load', function () { requestAnimationFrame(start); }, { once: true });
    })();
  </script>
  <script>
    /* Golden Folder — one remote track through the existing player, streamed by the
       browser's native media pipeline. No fetch/Blob, no second player, no custom buffer. */
    (function () {
      'use strict';

      var TRACK = {
        url: 'https://pub-fa04af4cffb74c979c0f18d50fa5f218.r2.dev/Adagio%20-%20Florence%20Robineau.mp3',
        title: 'Adagio - Florence Robineau',
        name: 'Adagio - Florence Robineau.mp3'
      };

      var link = document.getElementById('void-golden-folder');
      var chip = document.getElementById('void-golden-status');
      if (!link || !chip) return;
      var text = chip.querySelector('.void-golden-status__text');
      var action = chip.querySelector('.void-golden-status__action');

      var busy = false;
      var hideTimer = 0;
      var actionKind = '';
      var lastState = '';
      var activeToken = 0;
      var terminalToken = 0;

      function setBusy(on) {
        busy = !!on;
        link.setAttribute('aria-busy', busy ? 'true' : 'false');
      }
      function clearHide() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = 0; }
      }
      function hideChip() {
        clearHide();
        chip.className = '';
        chip.setAttribute('aria-hidden', 'true');
      }
      function show(state, message, actionLabel, kind, autoHideMs) {
        lastState = state;
        clearHide();
        chip.className = 'is-on is-' + state + (actionLabel ? ' is-action' : '');
        text.textContent = message;
        actionKind = kind || '';
        if (actionLabel) {
          action.hidden = false;
          action.textContent = actionLabel;
          chip.setAttribute('aria-label', message + ' — ' + actionLabel);
        } else {
          action.hidden = true;
          chip.removeAttribute('aria-label');
        }
        chip.setAttribute('aria-hidden', 'false');
        if (autoHideMs) hideTimer = setTimeout(hideChip, autoHideMs);
      }

      function start(force) {
        var VM = window.VoidMusic;
        if (!VM) {
          show('error', 'The player is not ready. Reload the page.', '', '', 0);
          return;
        }
        if (busy && !force) return;
        try { if (!VM.isOpen()) VM.enter(); } catch (e) {}
        var st = null;
        try { st = VM.getState(); } catch (e) {}
        /* Already selected: resume or report, never assign the same source twice. */
        if (!force && st && st.currentUrl === TRACK.url) {
          if (st.ended || lastState === 'error') force = true;
          else if (st.playing) { show('playing', 'Playing', '', '', 2600); return; }
          else {
            setBusy(true);
            show('loading', 'Connecting…', '', '', 0);
            try { VM.toggle(); }
            catch (e) { setBusy(false); show('error', 'Could not start the track', 'Retry', 'retry', 0); }
            return;
          }
        }
        setBusy(true);
        show('loading', 'Connecting…', '', '', 0);
        try {
          VM.add([{ url: TRACK.url, name: TRACK.name, title: TRACK.title }], { playFirst: true, force: !!force });
        } catch (e) {
          setBusy(false);
          show('error', 'Could not start the track', 'Retry', 'retry', 0);
        }
      }

      link.addEventListener('click', function (e) {
        e.preventDefault();
        start(false);
      });

      action.addEventListener('click', function (e) {
        e.preventDefault();
        if (actionKind === 'retry') start(true);
        else if (actionKind === 'play') {
          setBusy(true);
          show('loading', 'Connecting…', '', '', 0);
          try { window.VoidMusic.toggle(); }
          catch (err) { setBusy(false); show('error', 'Could not start the track', 'Retry', 'retry', 0); }
        }
      });

      window.addEventListener('voidmusic:remote-state', function (e) {
        var d = e.detail || {};
        if (!d || d.url !== TRACK.url) return;
        /* Another source took over (local file, web player, removed track, stop):
           a stale "Connecting…" must never stay behind. */
        if (d.state === 'inactive') { activeToken = 0; terminalToken = 0; setBusy(false); hideChip(); return; }
        if (d.state === 'loading') {
          /* play() may reject before the native loadstart task lands; a late loadstart
             of the same attempt must not turn a visible block/error back into "Connecting…". */
          if (d.token && d.token === terminalToken) return;
          activeToken = d.token || 0;
          setBusy(true);
          show('loading', 'Connecting…', '', '', 0);
          return;
        }
        /* A late event from an older attempt (same URL, older token) must not
           overwrite the status of the attempt that is running now. */
        if (activeToken && d.token && d.token !== activeToken) return;
        if (d.state === 'buffering' || d.state === 'stalled') { show('buffering', 'Buffering…', '', '', 0); }
        else if (d.state === 'playing') { terminalToken = 0; setBusy(false); show('playing', 'Playing', '', '', 2600); }
        else if (d.state === 'paused') {
          // Ignore the pause caused by swapping a local source out; only a real mid-track pause clears the chip.
          if ((d.readyState || 0) >= 2) { terminalToken = 0; setBusy(false); hideChip(); }
        }
        else if (d.state === 'ended') { terminalToken = 0; setBusy(false); hideChip(); }
        else if (d.state === 'blocked') { terminalToken = d.token || 0; setBusy(false); show('blocked', 'Playback needs a tap', 'Play', 'play', 0); }
        else if (d.state === 'error') { terminalToken = d.token || 0; setBusy(false); show('error', 'This track could not be loaded', 'Retry', 'retry', 0); }
      });
    })();
  </script>
  <script src="void-counter.js" defer></script>
</body>
</html>
