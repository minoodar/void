<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letters presence UI fixture</title>
<link rel="stylesheet" href="../void-letters.css">
<style>html,body{margin:0;height:100%;background:#05060a}</style>
</head>
<body>
<div id="void-music-root" style="position:fixed;inset:0"></div>

<!-- Controlled transport: no request ever leaves this page.
     ?letter=<id> opens one letter, ?dir=rtl mirrors the document. -->
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  if (params.get('dir') === 'rtl') {
    document.documentElement.lang = 'fa';
    document.documentElement.dir = 'rtl';
  }
  var now = Math.floor(Date.now() / 1000);
  /* Feed order: the deep-linked moon letter is not part of the feed, so the
     reader's Next control walks human → root → unknown → none → invalid. */
  var letters = [
    {
      seq: 5, id: '22222222222222222222222222222222',
      body: 'A human mark, written by someone who sat with the question a while.',
      lang: 'en', presence: 'human',
      created_at: now - 1200, expires_at: now + 7 * 86400, votes_like: 1, votes_dislike: 0
    },
    {
      seq: 4, id: '33333333333333333333333333333333',
      body: 'A root mark: something that holds the ground while the sky moves.',
      lang: 'en', presence: 'root',
      created_at: now - 1800, expires_at: now + 7 * 86400, votes_like: 0, votes_dislike: 0
    },
    {
      seq: 3, id: '44444444444444444444444444444444',
      body: 'An unknown mark, chosen for the parts that have no name yet.',
      lang: 'en', presence: 'unknown',
      created_at: now - 2400, expires_at: now + 7 * 86400, votes_like: 2, votes_dislike: 1
    },
    {
      seq: 2, id: '55555555555555555555555555555555',
      body: 'A letter with no mark at all, sent without choosing a presence.',
      lang: 'en',
      created_at: now - 3000, expires_at: now + 7 * 86400, votes_like: 0, votes_dislike: 0
    },
    {
      seq: 1, id: '66666666666666666666666666666666',
      body: 'A letter that carries an unknown presence name and must render none.',
      lang: 'en', presence: 'dragon',
      created_at: now - 3600, expires_at: now + 7 * 86400, votes_like: 0, votes_dislike: 0
    },
    {
      seq: 6, id: '11111111111111111111111111111111',
      body: 'The moon keeps a secret and reveals it slowly, one quiet line at a time.',
      lang: 'en', secret_ink: true, presence: 'moon',
      created_at: now - 600, expires_at: now + 30 * 86400, votes_like: 3, votes_dislike: 0
    }
  ];
  window.__state = { letters: letters, calls: [] };

  function shape(letter) {
    return {
      seq: letter.seq, id: letter.id, body: letter.body, lang: letter.lang,
      secret_ink: letter.secret_ink === true, presence: letter.presence,
      created_at: letter.created_at, expires_at: letter.expires_at,
      votes_like: letter.votes_like, votes_dislike: letter.votes_dislike
    };
  }

  window.fetch = function (url, init) {
    var u = String(url);
    var method = (init && init.method) || 'GET';
    window.__state.calls.push({ url: u, method: method, body: init && init.body });
    function res(status, data) {
      return Promise.resolve(new Response(JSON.stringify(data), {
        status: status,
        headers: { 'Content-Type': 'application/json' }
      }));
    }
    if (u.indexOf('/letters/count') > -1) return res(200, { active: letters.length });
    if (u.indexOf('/letters/quota') > -1) {
      return res(200, {
        ok: true, limit: 3, used: 0, remaining: 3,
        window_seconds: 86400, retry_after: 0, server_now: now
      });
    }
    if (u.indexOf('/visitors/hit') > -1) return res(200, { ok: true, returning: false });
    if (u.indexOf('/visitors/stats') > -1) {
      return res(200, { ok: true, unique_visitors: 12, total_sessions: 20, returning_ratio: 0.4 });
    }
    if (u.indexOf('/site/updates') > -1) {
      return res(200, {
        ok: true, letters: [], next_after: 6, active: letters.length,
        unique_visitors: 12, total_sessions: 20, returning_ratio: 0.4
      });
    }
    if (method === 'PUT' || method === 'DELETE' || method === 'POST') {
      var single = /\/letters\/([0-9a-f]{32})\/vote$/.exec(u);
      if (single) {
        var voted = letters.find(function (letter) { return letter.id === single[1]; });
        if (!voted) return res(404, { ok: false, error: 'not_found' });
        return res(200, Object.assign({ ok: true, changed: false, capped: false }, shape(voted)));
      }
      return res(503, { ok: false, error: 'fixture_read_only' });
    }
    if (u.indexOf('/letters?') > -1) {
      return res(200, { letters: letters.map(shape), next_before: null });
    }
    var byId = /\/letters\/([0-9a-f]{32})$/.exec(u);
    if (byId) {
      var found = letters.find(function (letter) { return letter.id === byId[1]; });
      if (!found) return res(404, { ok: false, error: 'not_found' });
      var one = shape(found);
      one.text = one.body;
      delete one.body;
      return res(200, one);
    }
    return res(404, { ok: false, error: 'not_found' });
  };
})();
</script>
<script src="../void-letters-api.js"></script>
<script src="../void-letters.js"></script>
</body>
</html>
